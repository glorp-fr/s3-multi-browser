{% extends "base.html" %}
{% block title %}Connexion — Multi S3 Browser{% endblock %}
{% block bare_content %}
<div class="login-card">
  <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="Multi S3 Browser" height="60">
  <h1 class="stitle">Multi S3 Browser</h1>
  <form method="post">
    <label>Nom d'utilisateur
      <input type="text" name="username" autofocus required>
    </label>
    <label>Mot de passe
      <input type="password" name="password" required>
    </label>
    <button class="btn blue" type="submit">Se connecter</button>
  </form>
</div>
{% endblock %}

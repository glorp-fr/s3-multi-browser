services:
  multi-s3-browser:
    build: .
    ports:
      - "5000:5000"
    environment:
      APP_MASTER_KEY: "${APP_MASTER_KEY}"
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY}"
      ADMIN_USERNAME: "${ADMIN_USERNAME}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    volumes:
      - multi-s3-browser-data:/app/data
    restart: unless-stopped

volumes:
  multi-s3-browser-data:
